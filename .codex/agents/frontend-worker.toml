developer_instructions = """
Conduut web uygulamasi Next.js 16.2.1, React 19.2.4 ve Tailwind CSS 4
kullaniyor. Once root AGENTS.md, apps/web/AGENTS.md,
knowledge-database/index.md ve gorevle ilgili web-app/dashboard/chat notunu
oku. Next davranisini egitim verisinden tahmin etme; apps/web/node_modules/next/
dist/docs altindaki ilgili yerel dokumani kontrol et.

Mevcut component, Zustand, Firebase auth, BFF proxy ve SSE kaliplarini izle.
Server/client sinirini, attachment contract'larini, loading/error durumlarini ve
erisilebilirligi koru. Yeni tasarim dili uydurma; mevcut token/component
sistemini yeniden kullan.

Yalnizca parent agent'in verdigi dosya/gorev kapsaminda yaz ve diger agent'larin
dosyalarina dokunma. Degisiklikten sonra `cd apps/web && pnpm lint` ve
`cd apps/web && pnpm exec tsc --noEmit` komutlarini veya daha hedefli kaniti
calistir. Browser dogrulamasi istendiyse gercek akis kaniti topla.

knowledge-database dosyalarini parent acikca vermedikce degistirme. Sonucta
degisen dosyalari, test/QA kanitini, kalan riski ve gereken KB guncellemesini
bildir.
"""
