name: staging-foundation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PNPM_VERSION: "10.19.0"
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.10.5"
  REGION: europe-west3
  STAGING_DIR: infra/terraform/environments/staging
  BOOTSTRAP_DIR: infra/terraform/bootstrap

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CONDUUT_ENVIRONMENT: "test"
      CONDUUT_FIREBASE_CREDENTIALS_MODE: "emulator"
      CONDUUT_FIREBASE_PROJECT_ID: "ci-placeholder"
      CONDUUT_LOG_FILE_ENABLED: "false"
      CONDUUT_RUN_LOG_ENABLED: "false"
      FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Create placeholder web env
        working-directory: apps/web
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_FIREBASE_API_KEY=ci-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID=1:1234567890:web:placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=1234567890
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=ci-placeholder.firebasestorage.app
          AGENT_API_BASE_URL=http://agent:8000
          EOF

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install agent dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/n8n-registry
          python -m pip install -e "apps/agent[dev]"

      - name: Agent checks
        working-directory: apps/agent
        run: |
          ruff check .
          ruff format --check .
          pytest

      - name: Web checks
        working-directory: apps/web
        run: |
          pnpm lint
          pnpm exec tsc --noEmit

      - name: Docker compose config
        run: docker compose config --quiet

      - name: Docker build agent
        run: docker build -f apps/agent/Dockerfile .

      - name: Docker build web
        run: docker build -f apps/web/Dockerfile apps/web

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform init bootstrap
        run: terraform -chdir=${{ env.BOOTSTRAP_DIR }} init -backend=false

      - name: Terraform validate bootstrap
        run: terraform -chdir=${{ env.BOOTSTRAP_DIR }} validate

      - name: Terraform init staging
        run: terraform -chdir=${{ env.STAGING_DIR }} init -backend=false

      - name: Terraform validate staging
        run: terraform -chdir=${{ env.STAGING_DIR }} validate

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_FIREBASE_PROJECT_ID: ${{ vars.GCP_FIREBASE_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build image tags
        id: tags
        run: |
          echo "agent_image=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/agent:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "web_image=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/web:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Configure docker auth
        run: gcloud auth configure-docker ${GCP_REGION}-docker.pkg.dev --quiet

      - name: Create staging web env
        working-directory: apps/web
        run: |
          cat > .env.local <<EOF
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${GCP_FIREBASE_PROJECT_ID}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EOF

      - name: Capture previous revisions
        id: previous
        run: |
          web_revision=$(gcloud run services describe staging-conduut-web --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)
          agent_revision=$(gcloud run services describe staging-conduut-agent --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)
          echo "web_revision=${web_revision}" >> "${GITHUB_OUTPUT}"
          echo "agent_revision=${agent_revision}" >> "${GITHUB_OUTPUT}"

      - name: Build and push agent
        run: |
          docker build -f apps/agent/Dockerfile -t "${{ steps.tags.outputs.agent_image }}" .
          docker push "${{ steps.tags.outputs.agent_image }}"

      - name: Build and push web
        run: |
          docker build -f apps/web/Dockerfile -t "${{ steps.tags.outputs.web_image }}" apps/web
          docker push "${{ steps.tags.outputs.web_image }}"

      - name: Update existing Cloud Run services
        run: |
          gcloud run services update staging-conduut-agent --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --image "${{ steps.tags.outputs.agent_image }}" --quiet
          gcloud run services update staging-conduut-web --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --image "${{ steps.tags.outputs.web_image }}" --quiet

      - name: Public web smoke test
        id: smoke
        run: |
          web_run_url=$(gcloud run services describe staging-conduut-web --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format='value(status.url)')
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "${web_run_url}/" > /dev/null

      - name: Roll back traffic on failed smoke
        if: failure() && (steps.previous.outputs.web_revision != '' || steps.previous.outputs.agent_revision != '')
        run: |
          if [ -n "${{ steps.previous.outputs.web_revision }}" ]; then
            gcloud run services update-traffic staging-conduut-web --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --to-revisions "${{ steps.previous.outputs.web_revision }}=100"
          fi
          if [ -n "${{ steps.previous.outputs.agent_revision }}" ]; then
            gcloud run services update-traffic staging-conduut-agent --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --to-revisions "${{ steps.previous.outputs.agent_revision }}=100"
          fi
