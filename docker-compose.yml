services:
  n8n:
    image: n8nio/n8n:latest
    container_name: conduut-n8n
    environment:
      N8N_API_DISABLED: "false"
      N8N_API_KEY: "conduut-dev-api-key"
      N8N_ENCRYPTION_KEY: "conduut-dev-encryption-key-32chars!"
      N8N_USER_MANAGEMENT_DISABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      WEBHOOK_URL: "http://localhost:${CONDUUT_N8N_PORT:-6180}"
    ports:
      - "127.0.0.1:${CONDUUT_N8N_PORT:-6180}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - app-net
      - n8n-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    container_name: conduut-agent
    volumes:
      - ./apps/agent/serviceAccount.json:/app/serviceAccount.json:ro
      - ./logs/agent:/app/logs
    environment:
      CONDUUT_ENVIRONMENT: development
      CONDUUT_LOG_DIR: /app/logs
      CONDUUT_LOG_FILE_ENABLED: ${CONDUUT_LOG_FILE_ENABLED:-true}
      CONDUUT_LOG_LEVEL: ${CONDUUT_LOG_LEVEL:-INFO}
      CONDUUT_LOG_MAX_BYTES: ${CONDUUT_LOG_MAX_BYTES:-10485760}
      CONDUUT_LOG_BACKUP_COUNT: ${CONDUUT_LOG_BACKUP_COUNT:-5}
      CONDUUT_LOG_PAYLOAD_PREVIEW_CHARS: ${CONDUUT_LOG_PAYLOAD_PREVIEW_CHARS:-1000}
      CONDUUT_RUN_LOG_ENABLED: ${CONDUUT_RUN_LOG_ENABLED:-true}
      CONDUUT_RUN_LOG_RETENTION_DAYS: ${CONDUUT_RUN_LOG_RETENTION_DAYS:-30}
      CONDUUT_RUN_LOG_PREVIEW_CHARS: ${CONDUUT_RUN_LOG_PREVIEW_CHARS:-300}
      CONDUUT_N8N_URL: http://n8n:5678
      CONDUUT_N8N_API_KEY: ***REMOVED***
      CONDUUT_PUBLIC_WEB_URL: ${CONDUUT_PUBLIC_WEB_URL:-http://localhost:3000}
      CONDUUT_GOOGLE_OAUTH_CLIENT_ID: ${CONDUUT_GOOGLE_OAUTH_CLIENT_ID:-}
      CONDUUT_GOOGLE_OAUTH_CLIENT_SECRET: ${CONDUUT_GOOGLE_OAUTH_CLIENT_SECRET:-}
      CONDUUT_CONNECTION_ENCRYPTION_KEY: ${CONDUUT_CONNECTION_ENCRYPTION_KEY:-}
      CONDUUT_OAUTH_STATE_TTL_SECONDS: ${CONDUUT_OAUTH_STATE_TTL_SECONDS:-600}
    depends_on:
      n8n:
        condition: service_healthy
    ports:
      - "8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - app-net
      - n8n-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: conduut-web
    depends_on:
      agent:
        condition: service_healthy
    env_file:
      - ./apps/web/.env.local
    environment:
      AGENT_API_BASE_URL: http://agent:8000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-net

volumes:
  n8n-data:

networks:
  app-net:
    name: conduut-app-net
    driver_opts:
      com.docker.network.driver.mtu: "1450"
  n8n-net:
    name: conduut-n8n-net
    internal: true
